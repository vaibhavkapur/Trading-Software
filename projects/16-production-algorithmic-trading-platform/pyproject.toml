[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "production-algorithmic-trading-platform"
version = "0.1.0"
description = "Paper-first production algorithmic trading platform integrating canonical market/order contracts, deterministic strategy runtime, pre-trade risk gate, idempotent OMS, double-entry ledger, broker reconciliation, kill switch, observability, and operator console."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
patp = "trading_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_platform = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
