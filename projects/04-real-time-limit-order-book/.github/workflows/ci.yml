name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit, scenario and replay suites
        run: cargo test --locked -p lob-tests --test unit_book --test unit_sequencer --test unit_ladders --test unit_analytics --test unit_wire --test scenario_faults --test scenario_replay
      - name: Integration suites
        run: cargo test --locked -p lob-tests --test integration_api --test integration_clickhouse
      - name: Replay the committed capture
        run: cargo run --release --locked -p stream-api --bin lob -- replay --file examples/fixtures/session-faults.ndjson

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
