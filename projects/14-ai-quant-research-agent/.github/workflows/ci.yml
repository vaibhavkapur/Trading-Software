name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest tests/unit
      - name: Integration and scenario tests
        run: pytest tests/integration tests/scenarios
      - name: Smoke demo
        run: python scripts/demo.py --quiet
