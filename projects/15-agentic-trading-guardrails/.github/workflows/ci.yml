name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Format check
        run: |
          unformatted=$(gofmt -l src tests)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit, Scenario & Integration Tests (with race detector)
        run: go test -race -v ./tests/unit/... ./tests/scenarios/... ./tests/integration/...
      - name: Performance Profile
        run: go test -v ./tests/perf/...
      - name: Walkthrough & Failure Demo Smoke Check
        run: go run ./src/cmd/demo -mode=all
