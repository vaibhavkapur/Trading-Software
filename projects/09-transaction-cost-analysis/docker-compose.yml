# Local TCA service with the simulated fixture loaded. Published on loopback only: the
# API has no authentication and accepts imports from anyone who can reach it.
services:
  tca:
    build: .
    ports:
      - "127.0.0.1:8009:8009"
    environment:
      TCA_MAX_QUOTE_AGE_MS: "5000"
      TCA_MAX_CLOCK_SKEW_MS: "250"
      TCA_QUOTE_CLOCK: event
    volumes:
      - tca-data:/data

volumes:
  tca-data:
