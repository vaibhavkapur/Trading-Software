name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Check formatting and vet
        run: make lint

      - name: Run unit, integration, and scenario tests (race detector)
        run: make test

      - name: Run performance benchmark report
        run: make bench

      - name: Run paper demo and failure demo
        run: |
          make demo
          make failure-demo
