name: Local FIX simulator
on:
  push:
    paths:
      - 'projects/18-fix-protocol-gateway/**'
      - '.github/workflows/fix-protocol-gateway.yml'
  pull_request:
    paths:
      - 'projects/18-fix-protocol-gateway/**'
      - '.github/workflows/fix-protocol-gateway.yml'
defaults:
  run:
    working-directory: projects/18-fix-protocol-gateway
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: scripts/setup
      - run: scripts/validate
      - run: scripts/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctest-log
          path: projects/18-fix-protocol-gateway/build/Testing/Temporary/LastTest.log
