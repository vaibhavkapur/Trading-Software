[package]
name = "lob-tests"
description = "Unit, integration and scenario suites (kept outside the crates per the repository layout)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "support.rs"

[dependencies]
book-core.workspace = true
analytics.workspace = true
feed-adapter.workspace = true
stream-api.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest = { workspace = true, features = ["json"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[[test]]
name = "unit_book"
path = "unit/book.rs"
[[test]]
name = "unit_sequencer"
path = "unit/sequencer.rs"
[[test]]
name = "unit_ladders"
path = "unit/ladders.rs"
[[test]]
name = "unit_analytics"
path = "unit/analytics.rs"
[[test]]
name = "unit_wire"
path = "unit/wire.rs"
[[test]]
name = "integration_api"
path = "integration/api.rs"
[[test]]
name = "integration_clickhouse"
path = "integration/clickhouse.rs"
[[test]]
name = "scenario_faults"
path = "scenarios/faults.rs"
[[test]]
name = "scenario_replay"
path = "scenarios/replay.rs"
