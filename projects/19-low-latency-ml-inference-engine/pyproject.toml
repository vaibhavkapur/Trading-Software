[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "low-latency-ml-inference-engine"
version = "0.1.0"
description = "Low-latency financial ML inference engine with safe artifact contracts, Python reference scorer, C++20 native runtime, versioned routing, and latency benchmark harness."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary / Internal Prototype"}
dependencies = []

[project.optional-dependencies]
onnx = ["onnxruntime>=1.16.0", "numpy>=1.24.0"]
dev = ["pytest>=7.0"]

[project.scripts]
ml-inference-engine = "inference_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
