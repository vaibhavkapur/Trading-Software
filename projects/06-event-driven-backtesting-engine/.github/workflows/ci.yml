name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests examples scripts
          ruff format --check src tests examples scripts
      - name: Unit tests
        run: pytest tests/unit
      - name: Integration, replay and scenario tests
        run: pytest tests/integration tests/scenarios --junitxml=reports/junit.xml
      - name: Deterministic demo (run, replay from manifest, walk-forward)
        run: python -m backtester.demo
      - name: Failure demo
        run: python examples/failure_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            runs/
