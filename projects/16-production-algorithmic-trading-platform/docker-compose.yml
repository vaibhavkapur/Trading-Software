services:
  trading-platform:
    build: .
    container_name: patp-paper-platform
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PATP_MODE=PAPER
      - PATP_CONFIG=/app/config/platform.paper.json
      - PATP_DB_PATH=/var/lib/patp/platform.db
    volumes:
      - patp_state:/var/lib/patp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  patp_state:
