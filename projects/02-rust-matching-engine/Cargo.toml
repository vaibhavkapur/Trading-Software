[package]
name = "matching-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Deterministic price-time-priority matching engine with journaling, replay and latency benchmarks (simulated/paper only)"
publish = false # no license chosen yet, see README
default-run = "me"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tokio is used only by the gateway (network edge); the matching core is synchronous.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "signal"] }

[dev-dependencies]
proptest = "1"
criterion = "0.5"
tokio = { version = "1", features = ["time"] }

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "scenarios"
path = "tests/scenarios/main.rs"

[[bench]]
name = "matching"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
