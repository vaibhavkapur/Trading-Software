name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Unit tests
        run: pytest tests/unit
      - name: Integration and scenario tests
        run: pytest tests/integration tests/scenarios --junitxml=reports/junit.xml
      - name: Deterministic demo
        run: PYTHONPATH=src python -m atp.demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/
